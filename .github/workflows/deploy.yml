name: Production deployment unavailable

# The historical push-triggered deployment is retired. No server credentials
# are read and no server action is possible through this diagnostic workflow.
on:
  workflow_dispatch:

permissions: {}

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deployment until the production procedure is validated
        run: |
          echo "::error::Production deployment disabled: use a separately validated production procedure after dev acceptance. See docs/development/VPS_DEV_ROUTING.md."
          exit 1
