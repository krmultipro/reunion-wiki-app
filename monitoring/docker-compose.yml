version: "3.8"
services:
  docker-reader:
    image: reunionwiki-docker-reader:${MONITORING_RELEASE:-latest}
    build: ./gateway
    container_name: reunionwiki-docker-reader
    restart: unless-stopped
    user: "10001:10001"
    group_add:
      - "${DOCKER_SOCKET_GID:?Docker socket group required}"
    environment:
      TARGET_CONTAINER: reunionwiki_prod_web_1
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ipc:/ipc
    healthcheck:
      test: [CMD, python, /app/gateway.py, --healthcheck]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    logging:
      options: {max-size: "5m", max-file: "3"}
  telegram-logbot:
    image: reunionwiki-telegram-monitor:${MONITORING_RELEASE:-latest}
    build: ./logbot
    container_name: telegram-logbot
    restart: unless-stopped
    user: "10002:10001"
    env_file: [.env]
    environment:
      TARGET_CONTAINER: reunionwiki_prod_web_1
      SITE_URL: https://reunionwiki.re/
      STATE_PATH: /state/monitor.db
    depends_on: [docker-reader]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./ipc:/ipc:ro
      - ./state:/state
    healthcheck:
      test: [CMD, python, /app/monitor.py, --healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      options: {max-size: "5m", max-file: "3"}
